  load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):[]; }catch(e){ canPersist=false; return memCopy; } },
  save(list){ memCopy=list; try{ localStorage.setItem(KEY, JSON.stringify(list)); }catch(e){ storeFail(); } }

const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const sorted = l => [...l].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));

/* ===== BAGIAN 4B: ANALISIS KEBIASAAN (dari catatan Anda, 7 hari terakhir) ===== */
function analyze(){
  const days = lastDays(7), wk = entries.filter(e=>days.includes(e.date));
  const activeDays = new Set(wk.map(e=>e.date)).size;
  const warn = [], good = [];
  if(activeDays<3) return { warn, good, few:true, activeDays };
  const daysOf = k => new Set(wk.filter(e=>e.cat===k).map(e=>e.date)).size;

  // Tidur
  const sleep = wk.filter(e=>e.cat==='tidur');
  if(!isOn('tidur')){} else if(!sleep.length) warn.push(['Tidur belum dicatat','Tidak ada catatan tidur dalam 7 hari.','Catat jam dan lama tidur agar pola istirahat Anda bisa dipantau.']);
  else {
    const wd = sleep.filter(e=>e.dur);
    if(wd.length){
      const avg = Math.round(wd.reduce((s,e)=>s+e.dur,0)/wd.length);
      if(avg<360) warn.push(['Tidur kurang',`Rata-rata ${fmtMin(avg)} per catatan tidur.`,'Orang dewasa umumnya butuh sekitar 7–9 jam. Coba majukan jam tidur 30 menit setiap beberapa hari.']);
      else if(avg>=420) good.push(['Durasi tidur cukup',`Rata-rata ${fmtMin(avg)} per catatan tidur.`,'Pertahankan jam tidur yang teratur.']);
    }
    const late = sleep.filter(e=>(e.time>='00:00'&&e.time<'04:00')||e.time>='23:30').length;
    if(late>=3) warn.push(['Sering tidur larut',`${late} kali mulai tidur lewat pukul 23.30.`,'Matikan layar HP 30 menit sebelum tidur dan tetapkan jam tidur yang sama setiap hari.']);
  }

  // Kebiasaan rutin: semua kategori aktif (kecuali yang punya analisis khusus: tidur, bekerja, makan)
  const ADV = {
    olahraga:['Jarang olahraga','Olahraga rutin','Targetkan 3 hari per minggu. Mulai dari jalan kaki 15 menit.','Pertahankan ritme ini.'],
    membaca:['Membaca masih jarang','Rutin membaca','Sisihkan 10–15 menit sebelum tidur untuk membaca.','Kebiasaan membaca Anda sudah terbentuk.'],
    belajar:['Belajar belum rutin','Rutin belajar','Jadwalkan sesi singkat 20–30 menit di jam yang sama setiap hari.','Konsistensi belajar Anda bagus.']
  };
  activeCats().filter(k=>!['tidur','bekerja','makan'].includes(k)).forEach(k=>{
    const nm = CATS[k][0], d = daysOf(k), tg = settings.targets[k]||3, a = ADV[k];
    if(d<tg){ if(k==='lainnya') return; warn.push([a?a[0]:`${esc(nm)} belum mencapai target`, `${d} dari target ${tg} hari per minggu.`, a?a[2]:`Jadwalkan waktu tetap untuk ${esc(nm)}, atau turunkan target di Pengaturan jika terlalu tinggi.`]); }
    else good.push([a?a[1]:`${esc(nm)} sesuai target`, `${d} dari 7 hari.`, a?a[3]:`Pertahankan kebiasaan ${esc(nm.toLowerCase())} Anda.`]);
  });

  // Capaian angka untuk semua kategori aktif (jarak, repetisi, jumlah)
  activeCats().forEach(k=>{
    const f = FIELDS[k]||{}, l = wk.filter(e=>e.cat===k), sum = x => l.reduce((s,e)=>s+(typeof e[x]==='number'?e[x]:0),0);
    const fm = v => String(Math.round(v*10)/10).replace('.',',');
    const parts = [f.dist&&sum('dist')>0?`${fm(sum('dist'))} km`:'', f.rep&&sum('rep')>0?`${sum('rep')} repetisi`:'', f.amt&&sum('amt')>0?`${fm(sum('amt'))} ${esc(unitOf(k))}`:''].filter(Boolean);
    if(parts.length) good.push([`Capaian ${esc(CATS[k][0].toLowerCase())}`, parts.join(' dan ')+' dalam 7 hari.', 'Naikkan sedikit demi sedikit tiap minggu agar tetap konsisten.']);
  });

  // Bekerja
  const work = isOn('bekerja') ? wk.filter(e=>e.cat==='bekerja') : [];
  const perDay = {}; work.forEach(e=>{ perDay[e.date]=(perDay[e.date]||0)+(e.dur||0); });
  const longDays = Object.values(perDay).filter(m=>m>600).length;
  if(longDays>=2) warn.push(['Jam kerja terlalu panjang',`${longDays} hari bekerja lebih dari 10 jam.`,'Selipkan istirahat tiap 1–2 jam dan tetapkan batas jam selesai kerja.']);
  const lateWork = work.filter(e=>e.time>='22:00').length;
  if(lateWork>=2) warn.push(['Bekerja larut malam',`${lateWork} catatan kerja setelah pukul 22.00.`,'Berhenti bekerja 1–2 jam sebelum tidur agar lebih mudah beristirahat.']);

  // Makan (hanya jika Anda mencatat makan)
  if(isOn('makan') && wk.some(e=>e.cat==='makan')){
    const few = [...new Set(wk.map(e=>e.date))].filter(d=>wk.filter(e=>e.date===d&&e.cat==='makan').length<2).length;
    const lateEat = wk.filter(e=>e.cat==='makan'&&e.time>='21:00').length;
    if(lateEat>=3) warn.push(['Sering makan larut malam',`${lateEat} catatan makan setelah pukul 21.00.`,'Usahakan makan terakhir 2–3 jam sebelum tidur agar tidur lebih nyenyak.']);
    if(few>=3) warn.push(['Makan sering terlewat',`Pada ${few} hari tercatat kurang dari 2 kali makan.`,'Jika memang terlewat, jadwalkan waktu makan atau siapkan camilan sehat.']);
  }
  return { warn, good, few:false, activeDays };
}

  const days = lastDays(7), wk = la || entries.filter(e=>days.includes(e.date));
  const fmt = n => String(Math.round(n*10)/10).replace('.',',');
  const items = [];
  activeCats().forEach(k=>{
    const f = FIELDS[k]||{}, l = wk.filter(e=>e.cat===k), nm = esc(CATS[k][0]);
    const sum = x => l.reduce((s,e)=>s+(typeof e[x]==='number'?e[x]:0),0);
    if(f.dur){ const v = sum('dur'); if(v>0) items.push([k,nm+' • durasi',fmtMin(v)]); }
    if(f.amt){ const v = sum('amt'); if(v>0) items.push([k,nm+' • '+esc(unitOf(k)),fmt(v)]); }
    if(f.dist){ const v = sum('dist'); if(v>0) items.push([k,nm+' • km',fmt(v)]); }
    if(f.rep){ const v = sum('rep'); if(v>0) items.push([k,nm+' • repetisi',String(v)]); }
  });
  if(!items.length) return '';
  return '<h2>'+(title||'Rekap minggu ini')+'</h2><div class="stats">'+items.map(([k,l,n])=>`<div class="card"><div style="color:${CATS[k][2]}">${icon(k,20)}</div><div class="big" style="margin-top:6px;font-size:${n.length>6?24:30}px">${n}</div><div class="mute">${esc(l)}</div></div>`).join('')+'</div>';
}

// Waktu diketik sebagai jam dan menit (tanpa jam putar). Bawaannya mengikuti jam perangkat dan bisa diubah.
const timeRaw = () => val('f-th')+':'+val('f-tm');
function timeVal(){
  const h = val('f-th').trim(), m = val('f-tm').trim();
  if(!/^\d{1,2}$/.test(h) || !/^\d{1,2}$/.test(m)) return '';
  const H = +h, M = +m;
  return (H>23 || M>59) ? '' : pad(H)+':'+pad(M);
}

const FLD = ['dur','amt','dist','rep'], HEX = /^#[0-9A-Fa-f]{6}$/;
function cleanCustom(a){
  return Array.isArray(a) ? a.filter(c=>c&&typeof c.id==='string'&&/^k_[A-Za-z0-9]+$/.test(c.id)&&typeof c.name==='string'&&c.name.trim()).slice(0,6).map(c=>({ id:c.id, name:c.name.trim().slice(0,20), color:typeof c.color==='string'&&HEX.test(c.color)?c.color:'#7A8594', fl:Array.isArray(c.fl)?c.fl.filter(x=>FLD.includes(x)):[], u:typeof c.u==='string'?c.u.slice(0,15):'', ic:typeof c.ic==='string'&&/^[a-z]{2,12}$/.test(c.ic)?c.ic:'' })) : [];

function cleanOver(o){

async function sbAuth(grant, body){
  const r = await fetch(SB_URL+'/auth/v1/token?grant_type='+grant, { method:'POST', headers:{ apikey:SB_KEY, 'Content-Type':'application/json' }, body:JSON.stringify(body) });

  sbSave();
}
async function sbToken(){
  if(!Cloud.sess) throw new Error('belum masuk');
  if(Cloud.sess.exp - Date.now() < 60000){
    try{ await sbAuth('refresh_token', { refresh_token:Cloud.sess.refresh }); }
    catch(e){ if(e.status===400 || e.status===401){ Cloud.sess = null; sbSave(); } throw e; }
  }
  return Cloud.sess.token;
}
async function sbReq(path, opt){

Cloud.init = async function(){
  try{ const r = JSON.parse(localStorage.getItem(SBKEY)); if(r && r.token && r.refresh && r.uid) Cloud.sess = r; }catch(e){}
  if(!Cloud.sess){ Cloud.st = 'off'; return; }
  Cloud.st = 'sync'; render();
  await Cloud.pull(true);
};
Cloud.pull = async function(first){
  if(!Cloud.sess || Cloud.dirty || (modal && !first)) return;
  try{
    const rows = (await sbReq('docs?select=key,data')) || []; let st = null; const list = [], sent = {};
    rows.forEach(d=>{
      const v = d.data; if(!v) return;
      if(d.key==='settings') st = v.s;
      else if(/^m-\d{4}-\d{2}$/.test(d.key) && Array.isArray(v.entries)){ const ok = v.entries.filter(cleanE); list.push(...ok); sent[d.key] = JSON.stringify(ok); }
    });
    if(!list.length && !st){
      if(entries.length){ await Cloud.push(); toast('Data dipindahkan ke akun Anda'); }
      Cloud.st = 'ok'; render(); return;
    }
    if(st){ const hadName = !!(st && typeof st.name==='string' && st.name.trim()); adoptSettings(st); sent.settings = JSON.stringify(settings); if(!hadName && settings.name) sent.settings = ''; if(settings.name && modal && modal.type==='name' && modal.first) modal = null; }
    let merged = list;
    if(first){ const ids = new Set(list.map(e=>e.id)); merged = [...list, ...entries.filter(e=>!ids.has(e.id))]; }
    entries = merged; Store.save(entries); Cloud.sent = sent; Cloud.st = 'ok'; render();
    if(first && (merged.length!==list.length || sent.settings==='')) Cloud.schedule();
  }catch(e){ Cloud.st = Cloud.sess ? 'err' : 'off'; render(); }
};
Cloud.schedule = function(){
  if(!Cloud.sess) return;
  Cloud.dirty = true; Cloud.st = 'sync'; clearTimeout(Cloud.timer); Cloud.timer = setTimeout(Cloud.push, 900);
};
Cloud.push = async function(){
  if(!Cloud.sess) return;
  try{
    const m = {};
    entries.forEach(e=>{ const k = 'm-'+e.date.slice(0,7); (m[k] = m[k] || []).push(e); });
    const up = [];
    for(const k of Object.keys(m)){ const j = JSON.stringify(m[k]); if(Cloud.sent[k]!==j) up.push([k, { entries:m[k] }, j]); }
    const sj = JSON.stringify(settings);
    if(Cloud.sent.settings!==sj) up.push(['settings', { s:JSON.parse(sj) }, sj]);
    if(up.length){
      const now = new Date().toISOString();
      await sbReq('docs?on_conflict=user_id,key', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates,return=minimal' }, body:JSON.stringify(up.map(([key,data])=>({ user_id:Cloud.sess.uid, key, data, updated_at:now }))) });
      up.forEach(([k,,j])=>{ Cloud.sent[k] = j; });
    }
    for(const k of Object.keys(Cloud.sent)){ if(k!=='settings' && !m[k]){ await sbReq('docs?key=eq.'+encodeURIComponent(k), { method:'DELETE' }); delete Cloud.sent[k]; } }
    Cloud.dirty = false; Cloud.st = 'ok';
  }catch(e){ if(Cloud.st!=='err') toast('Gagal sinkron ke akun. Data tetap tersimpan di perangkat.'); Cloud.st = Cloud.sess ? 'err' : 'off'; }
  render();
};

/* ===== BAGIAN 5: KOMPONEN TAMPILAN ===== */
function entryBits(e){
  return [e.time, e.dur?fmtMin(e.dur):'', e.amt!==''&&e.amt!=null ? `${e.amt} ${esc(unitOf(e.cat))}`:'', e.dist!==''&&e.dist!=null ? `${String(e.dist).replace('.',',')} km`:'', e.rep!==''&&e.rep!=null ? `${e.rep} repetisi`:''].filter(Boolean).join(' • ');
}
// Satu gaya untuk Beranda dan Riwayat: kartu netral, garis warna di kiri, ketuk untuk Ubah atau Hapus
function entryCard(e, plain){
  const c = CATS[e.cat]||CATS.lainnya;
  return `<div class="card ec ecb${plain?' pl':''}" role="button" tabindex="0" style="--c:${c[2]}" data-act="opencard" data-id="${e.id}"><div class="ico" style="background:${c[2]}1F;color:${c[2]}">${icon(e.cat)}</div>
  <div class="grow"><div class="name">${esc(e.name)}${e.demo?' <span class="bd">contoh</span>':''}</div><div class="mute">${esc(c[0])} • ${entryBits(e)}</div>${e.note?`<div class="note">${esc(e.note)}</div>`:''}</div></div>`;
}
function entrySheet(){
  const e = entries.find(x=>x.id===modal.id); if(!e) return '';
  const c = CATS[e.cat]||CATS.lainnya, f = FIELDS[e.cat]||{};
  const row = (l,v) => `<div class="row" style="margin-top:8px"><span class="mute grow">${l}</span><b>${v}</b></div>`;
  const has = x => e[x]!=='' && e[x]!=null;
  return `<div class="ov" data-act="close"><div class="sheet"><div class="row"><div class="ico" style="background:${c[2]}1F;color:${c[2]}">${icon(e.cat)}</div><div class="grow"><div class="name">${esc(e.name)}${e.demo?' <span class="bd">contoh</span>':''}</div><div class="mute">${esc(c[0])} • ${fmtShort(e.date)} • ${e.time}</div></div></div>
  ${e.dur?row('Durasi',fmtMin(e.dur)):''}${has('amt')?row(esc(amtLabel(e.cat)),`${e.amt} ${esc(unitOf(e.cat))}`):''}${has('dist')?row('Jarak',`${String(e.dist).replace('.',',')} km`):''}${has('rep')?row('Repetisi',e.rep):''}
  ${e.note?`<p class="note" style="margin-top:12px">${esc(e.note)}</p>`:''}
  <div class="acts" style="margin-top:16px"><button class="btn pri grow" data-act="edit" data-id="${e.id}">Ubah</button><button class="btn del grow" data-act="askdel" data-id="${e.id}">Hapus</button><button class="btn" data-act="close">Tutup</button></div></div></div>`;
}
const openGroups = new Set();
function groupSummary(items){
  const n = items.length, sum = f => items.reduce((s,e)=>s+(typeof e[f]==='number'?e[f]:0),0);
  const fmt = v => String(Math.round(v*10)/10).replace('.',',');
  const dur = sum('dur'), amt = sum('amt'), dist = sum('dist'), rep = sum('rep'), cat = items[0].cat;
  return [`${n} kegiatan`, dur?fmtMin(dur):'', amt?`${fmt(amt)} ${esc(unitOf(cat))}`:'', dist?`${fmt(dist)} km`:'', rep?`${rep} repetisi`:''].filter(Boolean).join(' • ');
}
// Gabungkan kegiatan sekategori pada hari yang sama menjadi satu menu buka-tutup
function groupedCards(list){
  const order = [], by = {};
  list.forEach(e=>{ if(!by[e.cat]){ by[e.cat]=[]; order.push(e.cat); } by[e.cat].push(e); });
  const date = list.length ? list[0].date : '';
  return order.map(k=>{
    const items = by[k];
    if(items.length===1) return entryCard(items[0]);
    const c = CATS[k]||CATS.lainnya, key = date+'|'+k, open = openGroups.has(key);
    return `<div class="card grp ec" style="--c:${c[2]}"><button class="gh" data-act="grp" data-k="${esc(key)}" aria-expanded="${open}"><div class="ico" style="background:${c[2]}1F;color:${c[2]}">${icon(k)}</div><div class="grow"><div class="name">${esc(c[0])}<span class="gcount" style="background:${c[2]}1F;color:${c[2]}">${items.length}</span></div><div class="mute">${groupSummary(items)}</div></div><span class="chev">${icon('chev',20)}</span></button>${open?`<div class="gb">${items.map(x=>entryCard(x,true)).join('')}</div>`:''}</div>`;
  }).join('');
}
function emptyBox(msg, withSeed){
  return `<div class="card empty"><div style="color:var(--mute)">${icon('logo',44)}</div><p>${msg}</p>

function catChart(list, title){
  if(!list.length) return '';
  const by = {}; list.forEach(e=>{ by[e.cat]=(by[e.cat]||0)+1; });
  const rows = Object.entries(by).sort((a,b)=>b[1]-a[1]), tot = list.length, mx = rows[0][1], pc = n => Math.round(n/tot*100);
  let body;
  if(statMode==='bar'){
    body = `<div class="bars" style="height:150px">${rows.map(([k,n])=>{ const c=CATS[k]||CATS.lainnya; return `<div class="bar"><span><b style="color:var(--ink)">${n}</b></span><span style="font-size:10px">${pc(n)}%</span><i style="height:${n/mx*70}%;background:${c[2]}"></i><span style="color:${c[2]}">${icon(k,16)}</span></div>`; }).join('')}</div>`;
  } else {
    let acc = 0; const stops = [];
    rows.forEach(([k,n])=>{ const c=CATS[k]||CATS.lainnya, a=acc/tot*360, b=(acc+n)/tot*360; stops.push(`${c[2]} ${a}deg ${b}deg`); acc += n; });
    body = `<div style="width:160px;height:160px;border-radius:50%;margin:6px auto 14px;position:relative;background:conic-gradient(${stops.join(',')})"><div style="position:absolute;inset:34px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center"><div><div class="big" style="font-size:24px">${tot}</div><div class="mute" style="font-size:11px">kegiatan</div></div></div></div>`
      + rows.map(([k,n])=>{ const c=CATS[k]||CATS.lainnya; return `<div class="row" style="margin-bottom:6px"><i style="width:12px;height:12px;border-radius:4px;background:${c[2]};flex:none"></i><span class="grow">${esc(c[0])}</span><b>${n}</b><span class="mute" style="min-width:44px;text-align:right">${pc(n)}%</span></div>`; }).join('');
  }
  return `<div class="row" style="justify-content:space-between;margin:22px 0 10px"><h2 style="margin:0">${title}</h2><div class="row" style="gap:6px">${modeToggle()}</div></div><div class="card">${body}</div>`;
}

const val = id => document.getElementById(id).value;
function validate(d){
  const er = {};
  if(!d.name) er.name='Nama kegiatan wajib diisi.';
  if(!d.date) er.date='Tanggal wajib diisi.';
  if(!d.time) er.time='Isi jam 00-23 dan menit 00-59.';
  if(d.dur!=='' && !(Number.isInteger(+d.dur) && +d.dur>=1 && +d.dur<=1440)) er.dur='Isi 1–1440 menit.';
  if(d.amt!=='' && !(+d.amt>=0 && +d.amt<=100000)) er.amt='Isi angka 0 atau lebih.';
  if(d.dist!=='' && !(+d.dist>0 && +d.dist<=1000)) er.dist='Isi 0,1–1000 km.';
  if(d.rep!=='' && !(Number.isInteger(+d.rep) && +d.rep>=1 && +d.rep<=100000)) er.rep='Isi bilangan bulat 1 atau lebih.';
  return er;
}
function saveEntry(){
  const d = { name:val('f-name').trim(), cat:val('f-cat'), date:val('f-date'), time:timeVal(), dur:val('f-dur').trim(), amt:val('f-amt').trim(), dist:val('f-dist').trim(), rep:val('f-rep').trim(), note:val('f-note').trim() };
  const F = FIELDS[d.cat]||{}; ['dur','amt','dist','rep'].forEach(f=>{ if(!F[f]) d[f]=''; });
  errors = validate(d);
  if(Object.keys(errors).length){ modal.draft=d; render(); return; }
  d.dur = d.dur===''?'':+d.dur; d.amt = d.amt===''?'':+d.amt; d.dist = d.dist===''?'':+d.dist; d.rep = d.rep===''?'':+d.rep;
  if(modal.id){ entries = entries.map(e=>e.id===modal.id?{...e,...d}:e); toast('Perubahan disimpan'); }
  else { entries.push({ id:newId(), ...d }); toast('Kegiatan ditambahkan'); }
  modal=null; errors={}; commit();
}
function seed(){
  const items=[['Sarapan nasi uduk','makan','07:00','',1],['Baca novel','membaca','20:30',30,25],['Jogging pagi','olahraga','06:00',30,''],['Kerja proyek','bekerja','09:00',180,''],['Belajar bahasa Inggris','belajar','19:30',45,''],['Salat Subuh','ibadah','04:45','',''],['Tidur malam','tidur','22:30',420,'']];
  lastDays(7).forEach((d,di)=>items.forEach((it,i)=>{ if((di+i)%3!==0) entries.push({ id:newId(), name:it[0], cat:it[1], date:d, time:it[2], dur:it[3], amt:it[4], note:'', demo:true }); }));
  toast('Data contoh dimuat'); commit();
}
const actions = {
  dprev:()=>{ homeDate = shiftDay(homeDate,-1); render(); },
  dnext:()=>{ if(homeDate<todayStr()){ homeDate = shiftDay(homeDate,1); render(); } },
  dtoday:()=>{ homeDate = todayStr(); render(); },
  settheme:t=>{ theme = t.dataset.t; applyTheme(); try{ localStorage.setItem('dailylog:theme',theme); }catch(e){} const y=scrollY; render(); scrollTo(0,y); },
  togsettings:()=>{ if(view==='settings'){ view = prevView; } else { prevView = view; view = 'settings'; } scrollTo(0,0); render(); },
  togui:t=>{ const k=t.dataset.k; settings.ui[k]=!settings.ui[k]; saveSettings(); const y=scrollY; render(); scrollTo(0,y); },
  askdelcat:t=>{ modal={ type:'delcat', id:t.dataset.k }; render(); },
  askhidecat:t=>{ modal={ type:'hidecfm', id:t.dataset.k }; render(); },
  dohidecat:()=>{ actions.hidecat(); },
  dodelcat:()=>{ const id=modal.id; modal=null; actions.delcat({ dataset:{ k:id } }); },
  hidecat:()=>{ const id=modal.id; modal=null; render(); if(isOn(id)){ actions.togcat({ dataset:{ k:id } }); if(!isOn(id)) toast('Disembunyikan dari kategori utama. Tambahkan lagi lewat + Tambah kategori.'); } },
  nav:t=>{ view=t.dataset.v; scrollTo(0,0); render(); },
  add:()=>{ modal={type:'form'}; errors={}; render(); },
  edit:t=>{ modal={type:'form',id:t.dataset.id}; errors={}; render(); },
  close:()=>{ modal = modal && modal.back ? modal.back : null; errors={}; render(); },
  save:saveEntry, seed,
  askdel:t=>{ modal={type:'del',id:t.dataset.id}; render(); },
  dodel:()=>{ const gone = entries.find(e=>e.id===modal.id), at = entries.indexOf(gone); entries = entries.filter(e=>e.id!==modal.id); modal = null; commit(); toast('Catatan dihapus', ()=>{ if(gone){ entries.splice(Math.min(at,entries.length),0,gone); commit(); } }); },
  askclear:()=>{ modal={type:'clear'}; render(); },
  opencard:t=>{ modal={ type:'entry', id:t.dataset.id }; render(); },
  cleardemo:()=>{ const bak = entries; entries = entries.filter(e=>!e.demo); commit(); toast('Data contoh dihapus', ()=>{ entries = bak; commit(); }); },
  quickcat:t=>{ modal={type:'form',draft:{name:'',cat:t.dataset.k,date:todayStr(),time:nowTime(),dur:'',amt:'',dist:'',rep:'',note:''}}; errors={}; render(); },
  quick:t=>{ const e=entries.find(x=>x.id===t.dataset.id); if(!e) return; modal={type:'form',draft:{name:e.name,cat:e.cat,date:todayStr(),time:nowTime(),dur:e.dur,amt:e.amt,dist:e.dist,rep:e.rep,note:''}}; errors={}; render(); },
  editname:()=>{ modal={ type:'name', first:false }; errors={}; render(); },
  savename:()=>{
    const n = cleanName(val('nm'));
    if(!n){ modal={ ...modal, val:'' }; errors={ nm:'Nama tidak boleh kosong.' }; render(); return; }
    settings.name = n; saveSettings(); try{ localStorage.removeItem('dailylog:noname'); }catch(e){}
    modal = null; errors = {}; render(); toast('Halo, '+n+'!');
  },
  skipname:()=>{ try{ localStorage.setItem('dailylog:noname','1'); }catch(e){} modal = null; errors = {}; render(); },
  openlogin:()=>{ modal={type:'login'}; errors={}; render(); },
  openreg:()=>{ modal={ type:'register' }; errors={}; render(); },
  doreg:async()=>{
    if(!document.getElementById('rg-e')) return;
    const n = val('rg-n').trim(), email = val('rg-e').trim(), pw = val('rg-p');
    const bad = n.length<2 ? 'Nama minimal 2 huruf.'
      : !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) ? 'Masukkan alamat email yang valid.'
      : (pw.length<8 || !/[A-Za-z]/.test(pw) || !/\d/.test(pw)) ? 'Kata sandi minimal 8 karakter, berisi huruf dan angka.' : '';
    if(bad){ modal={ type:'register', n, email }; errors={ reg:bad }; render(); return; }
    toast('Mendaftarkan...');
    const fail = msg => { modal={ type:'register', n, email }; errors={ reg:msg }; render(); };
    try{
      const r = await fetch(SB_URL+'/auth/v1/signup', { method:'POST', headers:{ apikey:SB_KEY, 'Content-Type':'application/json' }, body:JSON.stringify({ email, password:pw, data:{ name:n } }) });
      const j = await r.json().catch(()=>({}));
      const m = String(j.msg||j.message||j.error_description||'').toLowerCase();
      const dup = r.ok && j.user && Array.isArray(j.user.identities) && j.user.identities.length===0;
      if(dup || m.includes('already') || j.error_code==='user_already_exists') return fail('Email ini sudah terdaftar. Silakan masuk.');
      if(!r.ok){
        return fail(r.status===429 || m.includes('rate') ? 'Terlalu banyak percobaan. Tunggu sebentar lalu coba lagi.'
          : m.includes('password') ? 'Kata sandi ditolak: terlalu lemah atau terlalu umum.'
          : 'Pendaftaran gagal (' + r.status + ')' + (j.msg||j.message ? ': ' + (j.msg||j.message) : '.'));
      }
      if(!settings.name){ settings.name = n; saveSettings(); }
      if(!j.access_token){ modal = null; errors = {}; render(); toast('Cek email ' + email + ' untuk konfirmasi, lalu masuk.'); return; }
      await sbAuth('password', { email, password:pw });
      modal = null; errors = {}; Cloud.st = 'sync'; render();
      await Cloud.pull(true); toast('Akun dibuat dan sudah masuk');
    }catch(e){ fail('Tidak bisa terhubung ke server. Periksa koneksi internet lalu coba lagi.'); }
  },
  dologin:async()=>{
    if(!document.getElementById('lg-e')) return;
    const email = val('lg-e').trim(), pw = val('lg-p');
    if(!email || !pw){ modal={ type:'login', email }; errors={ login:'Email dan kata sandi wajib diisi.' }; render(); return; }
    toast('Masuk...');
    try{
      await sbAuth('password', { email, password:pw });
      modal = null; errors = {}; Cloud.st = 'sync'; render();
      await Cloud.pull(true); toast('Berhasil masuk');
    }catch(e){
      modal = { type:'login', email };
      const m = String(e.message||'').toLowerCase();
      errors = { login: !e.status ? 'Tidak bisa terhubung ke server. Periksa koneksi internet Anda lalu coba lagi.'
        : e.status===429 || m.includes('rate limit') ? 'Terlalu banyak percobaan. Tunggu sebentar lalu coba lagi.'
        : m.includes('not confirmed') ? 'Email belum dikonfirmasi. Buka email dari DailyLog dan ketuk tautan konfirmasinya, lalu masuk lagi.'
        : m.includes('invalid login') ? 'Email atau kata sandi salah. Belum punya akun? Ketuk Daftar di bawah.'
        : e.status===401 || e.status===403 ? 'Akses ditolak (' + e.status + '). Muat ulang halaman lalu coba lagi.'
        : 'Gagal masuk (' + e.status + '). Coba lagi nanti.' };
      render();
    }
  },
  logout:()=>{ Cloud.sess = null; sbSave(); Cloud.st = 'off'; Cloud.sent = {}; Cloud.dirty = false; clearTimeout(Cloud.timer); render(); toast('Anda sudah keluar. Data tetap ada di perangkat ini.'); },
  backup:()=>{ modal={type:'backup'}; errors={}; render(); },
  dlcsv:()=>saveFile('dailylog-'+todayStr()+'.csv', csvText(), 'text/csv'),
  dljson:()=>saveFile('dailylog-cadangan-'+todayStr()+'.json', bkText(), 'application/json'),
  copybk:()=>copyText(bkText(), 'Teks cadangan disalin'),
  copycsv:()=>copyText(csvText(), 'CSV disalin'),
  mealname:t=>{ document.getElementById('f-name').value = t.dataset.n; },
  zoom:t=>{ settings.zoom=+t.dataset.z; saveSettings(); const y=scrollY; render(); scrollTo(0,y); },
  newcatsheet:()=>{ const back = modal && modal.type==='form' ? { ...modal, draft:readDraft() } : null; modal = { type:'cat', id:null, color:'#2C9C8F', fl:[], u:'', ic:'', back }; errors={}; render(); },
  editcat:t=>{ const id=t.dataset.k; modal={ type:'cat', id, color:CATS[id][2], fl:Object.keys(FIELDS[id]||{}), u:(unitOf(id)==='jumlah'?'':unitOf(id)), ic:((settings.custom.find(c=>c.id===id)||settings.over[id]||{}).ic||'') }; render(); },
  pickicon:t=>{ modal.ic=t.dataset.i; const pv=document.querySelector('.sheet .ico'); if(pv) pv.innerHTML=icon0(modal.ic); document.querySelectorAll('.ib').forEach(b=>{ const on=b.dataset.i===modal.ic; b.style.outline=on?'2px solid var(--acc)':'none'; b.style.background=on?'var(--accbg)':'var(--card)'; }); },
  pickcolor:t=>{ modal.color=t.dataset.c; const pv=document.querySelector('.sheet .ico'); if(pv){ pv.style.background=modal.color+'1F'; pv.style.color=modal.color; } document.querySelectorAll('.sw').forEach(b=>{ b.style.outline = b.dataset.c===modal.color ? '3px solid var(--ink)' : 'none'; }); },
  savecat:()=>{
    const id = modal.id, n = val('cn').trim(), fl = ['dur','amt','dist','rep'].filter(f=>modal.fl.includes(f)), u = fl.includes('amt') ? val('cu').trim().slice(0,15) : '';
    if(n.length<2||n.length>20){ toast('Nama harus 2-20 huruf'); return; }
    if(Object.entries(CATS).some(([k,c])=>k!==id&&c[0].toLowerCase()===n.toLowerCase())){ toast('Nama sudah dipakai'); return; }
    if(!id){
      if(settings.custom.length>=6){ toast('Maksimal 6 kategori sendiri'); return; }
      const nid = 'k_'+newId(); settings.custom.push({ id:nid, name:n, color:modal.color, fl, u, ic:modal.ic||'' }); syncCustom(); saveSettings();
      const back = modal.back; modal = back ? { ...back, draft:{ ...(back.draft||{}), cat:nid } } : null; render(); toast('Kategori ditambahkan'); return;
    }
    const cu = settings.custom.find(c=>c.id===id);
    if(cu){ Object.assign(cu,{ name:n, color:modal.color, fl, u, ic:modal.ic||'' }); } else { settings.over[id]={ name:n, color:modal.color, fl, u, ic:modal.ic||'' }; }
    syncCustom();
    saveSettings(); modal=null; render(); toast('Kategori diperbarui');
  },
  resetcat:()=>{
    const id = modal.id; if(!CATS0[id]) return;
    delete settings.over[id]; CATS[id][0]=CATS0[id][0]; CATS[id][2]=CATS0[id][2]; FIELDS[id]=JSON.parse(JSON.stringify(FIELDS0[id])); IC[id]=IC0[id];
    saveSettings(); modal=null; render(); toast('Kategori dikembalikan');
  },
  delcat:t=>{
    const id = t.dataset.k;
    entries = entries.map(e=>e.cat===id?{ ...e, cat:'lainnya' }:e);
    settings.custom = settings.custom.filter(c=>c.id!==id);
    delete CATS[id]; delete FIELDS[id]; delete IC[id];
    settings.hidden = settings.hidden.filter(h=>h!==id);
    if(filter.cat===id) filter.cat='';
    saveSettings(); Store.save(entries); const y=scrollY; render(); scrollTo(0,y); toast('Kategori dihapus, catatannya dipindah ke Lainnya');
  },
  togcat:t=>{
    const k=t.dataset.k, h=settings.hidden, next=h.includes(k)?h.filter(x=>x!==k):[...h,k];
    if(!Object.keys(CATS).some(c=>!next.includes(c))){ toast('Minimal satu kategori harus aktif'); return; }
    settings.hidden=next; saveSettings(); const y=scrollY; render(); scrollTo(0,y);
  },
  restore:()=>{
    const txt = val('rs').trim();
    try{
      const data = JSON.parse(txt); const arr = Array.isArray(data) ? data : data.entries; if(!Array.isArray(arr)) throw 0;
      const nc = Array.isArray(data) ? null : cleanCustom(data.custom), no = Array.isArray(data) ? null : cleanOver(data.over);
      const known = k => CATS0[k] || (nc ? nc.some(c=>c.id===k) : !!CATS[k]);
      const ok = arr.filter(e=>e&&typeof e.name==='string'&&e.name.trim()&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&/^\d{2}:\d{2}$/.test(e.time))
        .map(e=>({ id:newId(), name:e.name.trim().slice(0,60), cat:known(e.cat)?e.cat:'lainnya', date:e.date, time:e.time,
          dur:Number.isInteger(e.dur)&&e.dur>0&&e.dur<=1440?e.dur:'', amt:typeof e.amt==='number'&&e.amt>=0&&e.amt<=100000?e.amt:'', dist:typeof e.dist==='number'&&e.dist>0&&e.dist<=1000?e.dist:'', rep:Number.isInteger(e.rep)&&e.rep>0&&e.rep<=100000?e.rep:'',
          note:String(e.note||'').slice(0,200), demo:!!e.demo }));
      if(!ok.length) throw 0;
      if(nc){ resetCats(); settings.custom = nc; settings.over = no; syncCustom(); saveSettings(); }
      entries=ok; modal=null; errors={}; toast(ok.length+' catatan dipulihkan'); commit();
    }catch(x){ modal.txt=txt; errors.bk = txt ? 'Teks cadangan tidak valid.' : 'Pilih file atau tempel teks cadangan dulu.'; render(); }
  },
  doclear:()=>{ const bak = entries; entries = []; modal = null; commit(); toast('Semua data dihapus', ()=>{ entries = bak; commit(); }); },
  grp:t=>{ const k=t.dataset.k; if(openGroups.has(k)) openGroups.delete(k); else openGroups.add(k); const y=scrollY; render(); scrollTo(0,y); },
  enablecat:t=>{ const k=t.dataset.k; settings.hidden=settings.hidden.filter(h=>h!==k); saveSettings(); const back=modal&&modal.back; modal = back ? { ...back, draft:{ ...(back.draft||{}), cat:k } } : null; render(); toast(CATS[k][0]+' ditambahkan'); },
  stattab:t=>{ statTab=t.dataset.t; scrollTo(0,0); render(); },
  sdprev:()=>{ statDay=shiftDay(statDay,-1); render(); },
  sdnext:()=>{ if(statDay<todayStr()){ statDay=shiftDay(statDay,1); render(); } },
  sdtoday:()=>{ statDay=todayStr(); render(); },
  smprev:()=>{ statMonth=shiftMonth(statMonth,-1); render(); },
  smnext:()=>{ if(statMonth<todayStr().slice(0,7)){ statMonth=shiftMonth(statMonth,1); render(); } },
  smtoday:()=>{ statMonth=todayStr().slice(0,7); render(); },
  statmode:t=>{ statMode=t.dataset.m; const y=scrollY; render(); scrollTo(0,y); },
  reset:()=>{ filter.date=''; filter.cat=''; filter.q=''; render(); },
  theme:()=>{ const i=THEMES.findIndex(x=>x[0]===theme); theme=THEMES[(i+1)%3][0]; applyTheme(); try{ localStorage.setItem('dailylog:theme',theme); }catch(e){} render(); }
};
document.addEventListener('click', ev=>{
  const t = ev.target.closest('[data-act]');
  if(t && t.classList.contains('ov') && ev.target!==t) return; // klik di dalam kotak dialog tidak menutupnya
  if(t && actions[t.dataset.act]) actions[t.dataset.act](t);
});
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape' && modal){ modal=null; errors={}; render(); } if(ev.key==='Enter' && (ev.target.id==='lg-p'||ev.target.id==='lg-e')) actions.dologin(); if(ev.key==='Enter' && ev.target.id==='nm') actions.savename(); if(ev.key==='Enter' && ['rg-n','rg-e','rg-p'].includes(ev.target.id)) actions.doreg(); });
document.addEventListener('input', ev=>{
  const t = ev.target; if(t.id!=='f-th' && t.id!=='f-tm') return;
  t.value = t.value.replace(/\D/g,'').slice(0,2);
  if(t.id==='f-th'){
    if(t.value.length===1 && +t.value>2) t.value = '0'+t.value;   // 7 langsung menjadi 07
    if(t.value.length===2){ const m = document.getElementById('f-tm'); m.focus(); if(m.select) m.select(); }
  }
});
document.addEventListener('focusin', ev=>{ if((ev.target.id==='f-th'||ev.target.id==='f-tm') && ev.target.select) ev.target.select(); });
document.addEventListener('focusout', ev=>{ const t = ev.target; if((t.id==='f-th'||t.id==='f-tm') && t.value.length===1) t.value = '0'+t.value; });
document.addEventListener('change', ev=>{
  if(ev.target.id==='rf'){ const f = ev.target.files[0]; if(!f) return; if(f.size>5e6){ toast('File terlalu besar.'); return; } f.text().then(t=>{ document.getElementById('rs').value = t.trim(); toast('File dibaca. Ketuk Pulihkan.'); }).catch(()=>toast('File tidak bisa dibaca.')); return; }
  if(ev.target.id==='fd'){ filter.date=ev.target.value; render(); }
  if(ev.target.id==='fc'){ filter.cat=ev.target.value; render(); }
  if(ev.target.dataset.ui){ settings.ui[ev.target.dataset.ui]=+ev.target.value; saveSettings(); const y=scrollY; render(); scrollTo(0,y); }
  if(ev.target.dataset.fl){ const k=ev.target.dataset.fl; modal.fl = ev.target.checked ? [...new Set([...modal.fl,k])] : modal.fl.filter(x=>x!==k); document.getElementById('ug').style.display = modal.fl.includes('amt') ? '' : 'none'; }
  if(ev.target.id==='f-cat'){ document.getElementById('l-amt').textContent = amtLabel(ev.target.value)+' (opsional)'; ['dur','amt','dist','rep'].forEach(f=>{ document.getElementById('g-'+f).style.display = FIELDS[ev.target.value]?.[f] ? '' : 'none'; }); document.getElementById('meal-chips').style.display = ev.target.value==='makan'?'flex':'none'; }
  if(ev.target.id==='fq'){ filter.q=ev.target.value.trim(); render(); }
  if(ev.target.dataset.tg){ settings.targets[ev.target.dataset.tg]=+ev.target.value; saveSettings(); toast('Target disimpan'); const y=scrollY; render(); scrollTo(0,y); }
});
render();
try{ if(!settings.name && !localStorage.getItem('dailylog:noname')){ modal = { type:'name', first:true }; render(); } }catch(e){}
Cloud.init();
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) Cloud.pull(false); });
if('serviceWorker' in navigator) addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
